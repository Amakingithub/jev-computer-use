[project]
name = "jev-computer-use"
version = "0.1.0"
description = "Jev (TypeSafe System One) decision layer + hardware-fitted computer-use cascade (CPU-first: OCR + free cloud decision/VLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mss",
    "Pillow",
]

[project.optional-dependencies]
computer-use = [
    "rapidocr-onnxruntime",
    "pyautogui",
]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
jev-decision = "jev_computer_use.decision_cli:main"
jev-computer-use = "jev_computer_use.computer_use.run_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_computer_use"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]